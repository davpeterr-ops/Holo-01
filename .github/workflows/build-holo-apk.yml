
name: Build HOLO.01 APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'HOLO-01-cloud-build.zip'
      - '.github/workflows/build-holo-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Extract Android project
        run: |
          unzip -o HOLO-01-cloud-build.zip
          test -f HOLO-01-native/settings.gradle
          test -f HOLO-01-native/app/src/main/AndroidManifest.xml

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: HOLO-01-native
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HOLO-01-debug-apk
          path: HOLO-01-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
concurrency:
  
